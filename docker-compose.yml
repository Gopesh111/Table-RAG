version: '3.8'

services:
  tablerag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tablerag-api
    ports:
      - "8000:8000"
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:3b
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
    depends_on:
      - ollama
    restart: unless-stopped
    networks:
      - tablerag-network

  ollama:
    image: ollama/ollama:latest
    container_name: tablerag-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - tablerag-network

volumes:
  ollama_data:
    driver: local

networks:
  tablerag-network:
    driver: bridge
